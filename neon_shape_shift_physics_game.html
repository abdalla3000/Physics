<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Shape-Shift Physics 2D</title>
    <!-- Tailwind CSS for UI Overlay -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter & Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            background-color: #080914;
            color: #f3f4f6;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #11152b 0%, #070814 100%);
        }
        /* Glassmorphism UI Style */
        .glass-panel {
            background: rgba(18, 24, 48, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-btn {
            transition: all 0.2s ease-in-out;
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
        }
        .neon-btn:hover {
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.6);
            transform: translateY(-2px);
        }
        .neon-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body class="w-screen h-screen relative flex flex-col justify-between overflow-hidden">

    <!-- Top Floating HUD Container -->
    <header class="absolute top-4 left-4 right-4 z-10 flex justify-between items-center pointer-events-none">
        <!-- Status Indicator -->
        <div class="glass-panel px-5 py-3 rounded-2xl flex items-center gap-4 pointer-events-auto">
            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-400 font-semibold">حالة الشخصية:</span>
                <div id="statusBadge" class="flex items-center gap-2 px-3 py-1 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30">
                    <i id="statusIcon" class="fa-solid fa-square"></i>
                    <span id="statusText">مربع (دفع قوي)</span>
                </div>
            </div>
            <div class="h-6 w-[1px] bg-white/10"></div>
            <div class="flex items-center gap-2">
                <span class="text-xs text-gray-400 font-semibold">المكعبات:</span>
                <span id="cubeCount" class="text-lg font-extrabold text-pink-400">0</span>
            </div>
        </div>

        <!-- Title & Action Buttons -->
        <div class="flex items-center gap-3 pointer-events-auto">
            <button id="resetBtn" class="glass-panel neon-btn px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-semibold text-white hover:border-pink-500/50">
                <i class="fa-solid fa-rotate-right text-pink-400"></i>
                إعادة المرحلة
            </button>
            <button id="clearCubesBtn" class="glass-panel neon-btn px-4 py-2.5 rounded-xl flex items-center gap-2 text-sm font-semibold text-white hover:border-amber-500/50">
                <i class="fa-solid fa-trash text-amber-400"></i>
                مسح المكعبات
            </button>
        </div>
    </header>

    <!-- Bottom Controls & Instructions Overlay -->
    <footer class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 pointer-events-none w-full max-w-3xl px-4">
        <div class="glass-panel px-6 py-3 rounded-2xl flex justify-around items-center text-xs md:text-sm text-gray-300 pointer-events-auto border border-white/10">
            <div class="flex items-center gap-2">
                <span class="px-2 py-1 bg-white/10 rounded border border-white/20 font-mono text-cyan-300">← →</span>
                <span>تحرك وادفع بجسمك</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-2 py-1 bg-white/10 rounded border border-white/20 font-mono text-cyan-300">↑</span>
                <span>قفز</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 bg-cyan-500/20 text-cyan-300 rounded border border-cyan-500/30 font-semibold">كليك يمين</span>
                <span>تحول</span>
            </div>
            <div class="flex items-center gap-2">
                <span class="px-2.5 py-1 bg-pink-500/20 text-pink-300 rounded border border-pink-500/30 font-semibold">كليك شمال</span>
                <span>إضافة / سحب الصناديق</span>
            </div>
        </div>
    </footer>

    <!-- Main Game Canvas -->
    <canvas id="gameCanvas" class="w-full h-full"></canvas>

    <!-- Game Engine Logic Script -->
    <script>
        // Setup Canvas Context
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // UI Element References
        const statusBadge = document.getElementById('statusBadge');
        const statusIcon = document.getElementById('statusIcon');
        const statusText = document.getElementById('statusText');
        const cubeCountEl = document.getElementById('cubeCount');
        const resetBtn = document.getElementById('resetBtn');
        const clearCubesBtn = document.getElementById('clearCubesBtn');

        // Dynamic Canvas Resize
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            if (player) {
                player.x = Math.min(player.x, width - player.size);
                player.y = Math.min(player.y, height - player.size - 50);
            }
        }

        // --- Sound Effects Synthesizer (Web Audio API) ---
        class SoundSystem {
            constructor() {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
            playJump() {
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }
            playMorph() {
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.2);
            }
            playDrop() {
                if(this.ctx.state === 'suspended') this.ctx.resume();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(120, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(45, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
        }
        const audio = new SoundSystem();

        // Particle System for Visual Effects
        let particles = [];
        class Particle {
            constructor(x, y, color, size = Math.random() * 4 + 2, speedMult = 1) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                this.vx = (Math.random() - 0.5) * 6 * speedMult;
                this.vy = (Math.random() - 0.5) * 6 * speedMult;
                this.life = 1.0;
                this.decay = Math.random() * 0.03 + 0.015;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
                this.size = Math.max(0, this.size - 0.05);
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createBurst(x, y, color, count = 15, speedMult = 1) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, Math.random() * 5 + 2, speedMult));
            }
        }

        // --- Physics Engine Variables ---
        const GRAVITY = 0.55;
        let cubes = [];
        let draggedCube = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        // Dynamic Block/Cube Class with Full Physics Velocity Transfer
        class Cube {
            constructor(x, y, size = 40) {
                this.x = x - size / 2;
                this.y = y;
                this.size = size;
                this.vx = 0;
                this.vy = 2;
                this.isGrounded = false;
                this.isDragged = false;
                this.color = '#ff007f';
                this.glow = '#ff77bc';
                this.mass = 1.2;
                this.friction = 0.88;
            }

            update() {
                if (this.isDragged) {
                    this.vx = 0;
                    this.vy = 0;
                    return;
                }

                // Apply Gravity & Friction
                this.vy += GRAVITY;
                this.vx *= this.friction;

                this.x += this.vx;
                this.y += this.vy;

                // Screen Edge Collisions
                if (this.x < 0) {
                    this.x = 0;
                    this.vx *= -0.5;
                }
                if (this.x + this.size > width) {
                    this.x = width - this.size;
                    this.vx *= -0.5;
                }

                // Floor Collision
                const floorY = height - 40;
                if (this.y + this.size >= floorY) {
                    this.y = floorY - this.size;
                    if (!this.isGrounded && Math.abs(this.vy) > 2.5) {
                        createBurst(this.x + this.size/2, this.y + this.size, this.color, 6, 0.4);
                        audio.playDrop();
                    }
                    this.vy = 0;
                    this.isGrounded = true;
                } else {
                    this.isGrounded = false;
                }

                // Cube to Cube Physics (Push & Stacking)
                for (let other of cubes) {
                    if (other === this || other.isDragged) continue;

                    if (this.x < other.x + other.size &&
                        this.x + this.size > other.x &&
                        this.y < other.y + other.size &&
                        this.y + this.size > other.y) {

                        let overlapX = Math.min(this.x + this.size - other.x, other.x + other.size - this.x);
                        let overlapY = Math.min(this.y + this.size - other.y, other.y + other.size - this.y);

                        if (overlapX < overlapY) {
                            if (this.x < other.x) {
                                this.x -= overlapX / 2;
                                other.x += overlapX / 2;
                            } else {
                                this.x += overlapX / 2;
                                other.x -= overlapX / 2;
                            }
                            let avgVx = (this.vx + other.vx) / 2;
                            this.vx = avgVx;
                            other.vx = avgVx;
                        } else {
                            if (this.y < other.y) {
                                this.y = other.y - this.size;
                                this.vy = 0;
                                this.isGrounded = true;
                            } else {
                                this.y = other.y + other.size;
                                this.vy = 0;
                            }
                        }
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.shadowColor = this.isDragged ? '#ffffff' : this.glow;
                ctx.shadowBlur = this.isDragged ? 22 : 12;
                
                // Outer Glow Fill
                ctx.fillStyle = this.isDragged ? 'rgba(255, 255, 255, 0.3)' : 'rgba(255, 0, 127, 0.2)';
                ctx.fillRect(this.x, this.y, this.size, this.size);

                // Neon Stroke Border
                ctx.strokeStyle = this.isDragged ? '#ffffff' : this.color;
                ctx.lineWidth = this.isDragged ? 3.5 : 2.5;
                ctx.strokeRect(this.x, this.y, this.size, this.size);

                // Grid Design Inside Block
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.x + 8, this.y + 8);
                ctx.lineTo(this.x + this.size - 8, this.y + this.size - 8);
                ctx.moveTo(this.x + this.size - 8, this.y + 8);
                ctx.lineTo(this.x + 8, this.y + this.size - 8);
                ctx.stroke();

                ctx.restore();
            }
        }

        // Main Player Class with Body Pushing Mechanics
        class Player {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.size = 44;
                this.radius = this.size / 2;
                this.vx = 0;
                this.vy = 0;
                this.isCircle = false;
                this.isGrounded = false;
                this.rotation = 0;
                this.angularVelocity = 0;

                this.squareColor = '#00f3ff';
                this.circleColor = '#7000ff';
            }

            toggleShape() {
                this.isCircle = !this.isCircle;
                createBurst(this.x + this.radius, this.y + this.radius, this.isCircle ? this.circleColor : this.squareColor, 25, 1.5);
                audio.playMorph();
                this.updateUI();
            }

            updateUI() {
                if (this.isCircle) {
                    statusBadge.className = "flex items-center gap-2 px-3 py-1 rounded-lg text-sm font-bold bg-purple-500/20 text-purple-300 border border-purple-500/30";
                    statusIcon.className = "fa-solid fa-circle";
                    statusText.innerText = "دائرة (تدحرج ودفع مرن)";
                } else {
                    statusBadge.className = "flex items-center gap-2 px-3 py-1 rounded-lg text-sm font-bold bg-cyan-500/20 text-cyan-400 border border-cyan-500/30";
                    statusIcon.className = "fa-solid fa-square";
                    statusText.innerText = "مربع (دفع قوي وثابت)";
                }
            }

            update(keys) {
                const accel = this.isCircle ? 0.85 : 0.65;
                const maxSpeed = this.isCircle ? 9 : 6.5;
                const friction = this.isCircle ? 0.985 : 0.82;

                // Horizontal Controls
                if (keys['ArrowRight'] || keys['KeyD']) {
                    this.vx += accel;
                }
                if (keys['ArrowLeft'] || keys['KeyA']) {
                    this.vx -= accel;
                }

                this.vx *= friction;
                this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));

                // Jump Controls
                if ((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && this.isGrounded) {
                    this.vy = this.isCircle ? -12.5 : -11.5;
                    this.isGrounded = false;
                    createBurst(this.x + this.radius, this.y + this.size, '#ffffff', 10, 0.8);
                    audio.playJump();
                }

                this.vy += GRAVITY;

                // Move X Position & Check Block Push Physics
                this.x += this.vx;
                this.handleHorizontalCubeCollisions();

                // Move Y Position & Check Standing/Landing Physics
                this.y += this.vy;
                this.handleVerticalCubeCollisions();

                // Rolling Animation Logic
                if (this.isCircle) {
                    this.angularVelocity = this.vx / this.radius;
                    this.rotation += this.angularVelocity;
                } else {
                    this.rotation *= 0.8;
                }

                // Wall Collisions
                if (this.x < 0) {
                    this.x = 0;
                    this.vx = 0;
                }
                if (this.x + this.size > width) {
                    this.x = width - this.size;
                    this.vx = 0;
                }

                // Ground Collision
                const floorY = height - 40;
                if (this.y + this.size >= floorY) {
                    this.y = floorY - this.size;
                    this.vy = 0;
                    this.isGrounded = true;
                }
            }

            // Body Hitbox Physics - Push Blocks Horizontally with Player Body
            handleHorizontalCubeCollisions() {
                for (let cube of cubes) {
                    if (cube.isDragged) continue;

                    if (this.x < cube.x + cube.size &&
                        this.x + this.size > cube.x &&
                        this.y < cube.y + cube.size &&
                        this.y + this.size > cube.y) {

                        // Push block away depending on movement direction
                        if (this.vx > 0) {
                            this.x = cube.x - this.size;
                            cube.vx += this.vx * 0.7; // Velocity transfer force
                        } else if (this.vx < 0) {
                            this.x = cube.x + cube.size;
                            cube.vx += this.vx * 0.7;
                        }
                    }
                }
            }

            // Body Hitbox Physics - Vertical Landing & Head Bumping
            handleVerticalCubeCollisions() {
                for (let cube of cubes) {
                    if (cube.isDragged) continue;

                    if (this.x < cube.x + cube.size &&
                        this.x + this.size > cube.x &&
                        this.y < cube.y + cube.size &&
                        this.y + this.size > cube.y) {

                        if (this.vy > 0 && this.y + this.size - this.vy <= cube.y + 12) {
                            // Land on top of cube
                            this.y = cube.y - this.size;
                            this.vy = 0;
                            this.isGrounded = true;
                        } else if (this.vy < 0 && this.y - this.vy >= cube.y + cube.size - 12) {
                            // Hit underside of cube
                            this.y = cube.y + cube.size;
                            this.vy = 0;
                        }
                    }
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x + this.radius, this.y + this.radius);
                ctx.rotate(this.rotation);

                const activeColor = this.isCircle ? this.circleColor : this.squareColor;
                ctx.shadowColor = activeColor;
                ctx.shadowBlur = 18;

                if (this.isCircle) {
                    ctx.fillStyle = 'rgba(112, 0, 255, 0.25)';
                    ctx.beginPath();
                    ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = activeColor;
                    ctx.lineWidth = 3;
                    ctx.stroke();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.lineTo(this.radius - 4, 0);
                    ctx.stroke();
                } else {
                    ctx.fillStyle = 'rgba(0, 243, 255, 0.25)';
                    ctx.fillRect(-this.radius, -this.radius, this.size, this.size);

                    ctx.strokeStyle = activeColor;
                    ctx.lineWidth = 3;
                    ctx.strokeRect(-this.radius, -this.radius, this.size, this.size);

                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.strokeRect(-this.radius / 2, -this.radius / 2, this.size / 2, this.size / 2);
                }

                ctx.restore();
            }
        }

        // --- Core Initialization ---
        let player;
        const keys = {};

        function init() {
            resize();
            player = new Player(width / 2 - 22, height - 120);
            cubes = [];
            particles = [];
            draggedCube = null;
            updateCubeCounter();
        }

        function updateCubeCounter() {
            cubeCountEl.innerText = cubes.length;
        }

        function spawnCubeAt(x, y) {
            const newCube = new Cube(x, y, 40);
            cubes.push(newCube);
            createBurst(x, y + 20, '#ff007f', 12, 1);
            updateCubeCounter();
        }

        // --- Event Listeners & Interaction ---

        window.addEventListener('resize', resize);

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // Right-Click Morph Shape
        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            player.toggleShape();
        });

        // Left Click: Pick up existing block OR Spawn new block
        window.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Check if clicking directly on an existing block to drag it
            for (let i = cubes.length - 1; i >= 0; i--) {
                let cube = cubes[i];
                if (mouseX >= cube.x && mouseX <= cube.x + cube.size &&
                    mouseY >= cube.y && mouseY <= cube.y + cube.size) {
                    draggedCube = cube;
                    cube.isDragged = true;
                    dragOffsetX = mouseX - cube.x;
                    dragOffsetY = mouseY - cube.y;
                    return;
                }
            }

            // Spawn Block directly in the middle area above player
            const spawnX = Math.max(50, Math.min(width - 50, player.x + player.radius));
            spawnCubeAt(spawnX, -40);
        });

        // Mouse Drag Move
        window.addEventListener('mousemove', (e) => {
            if (draggedCube) {
                const rect = canvas.getBoundingClientRect();
                draggedCube.x = e.clientX - rect.left - dragOffsetX;
                draggedCube.y = e.clientY - rect.top - dragOffsetY;
            }
        });

        // Mouse Release Drag
        window.addEventListener('mouseup', (e) => {
            if (e.button === 0 && draggedCube) {
                draggedCube.isDragged = false;
                draggedCube = null;
            }
        });

        // UI Reset & Clear Actions
        resetBtn.addEventListener('click', () => {
            init();
        });

        clearCubesBtn.addEventListener('click', () => {
            cubes = [];
            draggedCube = null;
            updateCubeCounter();
        });

        // Rendering Environment
        function drawEnvironment() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            const gridSize = 40;

            for (let x = 0; x < width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }
            for (let y = 0; y < height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            const floorY = height - 40;
            ctx.save();
            ctx.shadowColor = '#00f3ff';
            ctx.shadowBlur = 15;
            ctx.fillStyle = '#0d1329';
            ctx.fillRect(0, floorY, width, 40);

            ctx.strokeStyle = '#00f3ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, floorY);
            ctx.lineTo(width, floorY);
            ctx.stroke();
            ctx.restore();
        }

        // Main Animation Loop
        function animate() {
            ctx.clearRect(0, 0, width, height);

            drawEnvironment();

            // Update & Render Cubes
            for (let cube of cubes) {
                cube.update();
                cube.draw(ctx);
            }

            // Update & Render Player Body Physics
            player.update(keys);
            player.draw(ctx);

            // Particles Update & Draw
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw(ctx);
                if (particles[i].life <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(animate);
        }

        // Start Engine
        window.onload = () => {
            init();
            animate();
        };
    </script>
</body>
</html>
